name: CI

# Runner self-hosted (stage-vps; app na Stage): a cota de minutos hosted do
# GitHub acabou e job em ubuntu-latest nem começa.
#
# Nada de PHP no host: tudo roda na mesma imagem que o docker-compose usa. O
# Postgres de teste sobe numa rede docker por `run_id` e **sem publicar porta**
# — a Stage já tem Postgres no 5432, e a suíte deste repo trunca o banco.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, stage-vps]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Subir Postgres efêmero
        run: |
          NET="rp-ci-${{ github.run_id }}"
          docker network create "$NET"
          docker run -d --name "rp-ci-pg-${{ github.run_id }}" --network "$NET" --network-alias ci-pg \
            -e POSTGRES_DB=resolve_plus_test \
            -e POSTGRES_USER=resolve_plus \
            -e POSTGRES_PASSWORD=resolve_plus \
            postgres:17-alpine
          for i in $(seq 1 30); do
            docker exec "rp-ci-pg-${{ github.run_id }}" pg_isready -U resolve_plus -d resolve_plus_test >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Postgres não subiu a tempo" >&2
          exit 1

      - name: Instalar dependências PHP
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" -w /app \
            arthurlehdermann/alpine-nginx-php8.4 \
            composer install --no-interaction --prefer-dist

      - name: Preparar .env
        run: |
          cp .env.example .env
          docker run --rm \
            -v "${{ github.workspace }}:/app" -w /app \
            arthurlehdermann/alpine-nginx-php8.4 \
            php artisan key:generate

      - name: Rodar testes (Postgres real - suíte usa jsonb e índices parciais, não roda em sqlite)
        run: |
          docker run --rm \
            --network "rp-ci-${{ github.run_id }}" \
            -v "${{ github.workspace }}:/app" -w /app \
            -e DB_CONNECTION=pgsql \
            -e DB_HOST=ci-pg \
            -e DB_PORT=5432 \
            -e DB_DATABASE=resolve_plus_test \
            -e DB_USERNAME=resolve_plus \
            -e DB_PASSWORD=resolve_plus \
            arthurlehdermann/alpine-nginx-php8.4 \
            vendor/bin/phpunit

      - name: Pint (estilo)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" -w /app \
            arthurlehdermann/alpine-nginx-php8.4 \
            vendor/bin/pint --test

      - name: Larastan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" -w /app \
            arthurlehdermann/alpine-nginx-php8.4 \
            vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Teardown Postgres efêmero
        if: always()
        run: |
          docker rm -f "rp-ci-pg-${{ github.run_id }}" 2>/dev/null || true
          docker network rm "rp-ci-${{ github.run_id }}" 2>/dev/null || true
