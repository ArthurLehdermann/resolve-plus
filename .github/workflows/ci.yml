name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: resolve_plus
          POSTGRES_USER: resolve_plus
          POSTGRES_PASSWORD: resolve_plus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resolve_plus -d resolve_plus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: resolve_plus
      DB_USERNAME: resolve_plus
      DB_PASSWORD: resolve_plus

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, pdo_pgsql, bcmath, intl, redis
          coverage: none

      - name: Cache dependências do Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependências PHP
        run: composer install --no-interaction --prefer-dist

      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Rodar testes (Postgres real - suíte usa jsonb e índices parciais, não roda em sqlite)
        run: vendor/bin/phpunit

      - name: Pint (estilo)
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
        continue-on-error: true
